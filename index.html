<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>惊吓内容预警</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050505;color:#eee;font-family:system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}
body{min-height:100dvh}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
#intro{background:#fff;color:#222;align-items:flex-start;justify-content:flex-start;padding:8vh 8vw}
.warning-box{max-width:680px}
.warning-title{font-size:clamp(25px,6vw,38px);font-weight:900;color:#181818;margin:0 0 24px}
.warning-title span{color:#e0a000}
p{font-size:clamp(16px,4vw,20px);line-height:1.8}
button{border:0;border-radius:8px;padding:15px 22px;font-size:18px;cursor:pointer;touch-action:manipulation}
#go{background:#b30000;color:#fff;font-weight:bold;margin-top:18px}
#stage{display:none;background:#080808;flex-direction:column;text-align:center}
#exit{position:absolute;top:16px;right:16px;background:#252525;color:#ddd;padding:10px 14px;font-size:14px}
#wait{font-size:24px;color:#aaa;letter-spacing:2px}
#hint{color:#666;margin-top:20px}
#scare{display:none;background:#000;z-index:5;padding:0;animation:flash .12s 5}
.face{position:relative;width:min(94vw,94vh);height:min(94vw,94vh);background:radial-gradient(ellipse at 50% 35%,#eee 0,#c9c4bd 38%,#555 67%,#090909 78%);border-radius:48% 48% 45% 45%;overflow:hidden;box-shadow:0 0 50px #fff}
.hair{position:absolute;top:-3%;left:5%;width:90%;height:34%;background:#090909;border-radius:50% 50% 20% 20%;clip-path:polygon(0 0,100% 0,96% 75%,78% 52%,65% 100%,50% 54%,35% 100%,20% 53%,5% 80%)}
.eye{position:absolute;top:34%;width:25%;height:22%;background:#050505;border-radius:50%;box-shadow:inset 0 0 22px #300}
.eye:after{content:"";position:absolute;top:36%;left:40%;width:22%;height:28%;background:#eee;border-radius:50%;box-shadow:0 0 18px white}
.eye.left{left:14%;transform:rotate(-10deg)}.eye.right{right:14%;transform:rotate(10deg)}
.brow{position:absolute;top:29%;width:30%;height:8%;background:#111;border-radius:50%}
.brow.left{left:10%;transform:rotate(15deg)}.brow.right{right:10%;transform:rotate(-15deg)}
.nose{position:absolute;top:48%;left:43%;width:14%;height:18%;background:linear-gradient(90deg,#555,#ddd,#555);clip-path:polygon(50% 0,0 100%,100% 100%)}
.mouth{position:absolute;top:64%;left:22%;width:56%;height:26%;background:#050505;border-radius:48% 48% 40% 40%;box-shadow:inset 0 0 18px #900;overflow:hidden}
.teeth{position:absolute;top:0;left:5%;width:90%;height:23%;background:#eee;clip-path:polygon(0 0,100% 0,95% 100%,85% 70%,75% 100%,65% 70%,55% 100%,45% 70%,35% 100%,25% 70%,15% 100%,5% 70%)}
.lower-teeth{position:absolute;bottom:0;left:5%;width:90%;height:20%;background:#ddd;clip-path:polygon(0 100%,100% 100%,95% 0,85% 35%,75% 0,65% 35%,55% 0,45% 35%,35% 0,25% 35%,15% 0,5% 35%)}
@keyframes flash{0%,50%,100%{filter:none}25%,75%{filter:brightness(2.4)}}
</style>
</head>
<body>
<section id="intro" class="screen">
<div class="warning-box">
<h1 class="warning-title"><span>⚠️</span> 惊吓内容预警</h1>
<p>本页面可能出现突然的恐怖画面与音效。<br>确认周围环境安全、音量适当后再继续。</p>
<button id="go">我已知晓，继续</button>
</div>
</section>
<section id="stage" class="screen">
<button id="exit">退出</button>
<div id="wait">请稍候……</div>
<p id="hint">页面正在加载，请耐心等待</p>
</section>
<section id="scare" class="screen">
<div class="face" aria-label="恐怖脸">
<div class="hair"></div><div class="brow left"></div><div class="brow right"></div>
<div class="eye left"></div><div class="eye right"></div><div class="nose"></div>
<div class="mouth"><div class="teeth"></div><div class="lower-teeth"></div></div>
</div>
</section>
<script>
let timer=null,ctx=null;
const intro=document.getElementById('intro'),stage=document.getElementById('stage'),scare=document.getElementById('scare');
document.getElementById('go').addEventListener('click',()=>{
 intro.style.display='none';stage.style.display='flex';
 // Initialize audio during the tap for mobile webview compatibility.
 try{ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}
 const wait=9000+Math.random()*26000;
 timer=setTimeout(jump,wait);
});
function jump(){
 scare.style.display='flex';
 try{
  if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended')ctx.resume();
  const dur=1.25,buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*dur),ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,.38);
  const src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
  src.buffer=buf;f.type='bandpass';f.frequency.value=1400;f.Q.value=.65;
  g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.22,ctx.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+dur);
  src.connect(f);f.connect(g);g.connect(ctx.destination);src.start();
 }catch(e){}
}
document.getElementById('exit').addEventListener('click',()=>{
 clearTimeout(timer);scare.style.display='none';stage.style.display='none';intro.style.display='flex';
 if(ctx){ctx.close();ctx=null}
});
</script>
</body>
</html>
