<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#000"><title>检查页面</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#ddd;font-family:Arial,"Microsoft YaHei",sans-serif;overflow:hidden}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#warning{background:#f7f7f7;color:#222;align-items:flex-start;padding:9vh 8vw}
#warning h1{font-size:clamp(24px,7vw,38px);color:#161616}#warning p{font-size:17px;line-height:1.8}

#status{font-family:monospace;color:#aaa;font-size:18px;letter-spacing:1px}
#small{font-size:13px;color:#444}

#scare{display:none;z-index:10;background:#000;overflow:hidden}
#scene{position:absolute;width:100vw;height:100vh;display:grid;place-items:center;transform:scale(1.15)}
#face{position:relative;width:min(110vw,110vh);height:min(110vw,110vh);border-radius:48%;background:radial-gradient(ellipse at 50% 30%,#c5c3bb 0,#77766f 27%,#333 48%,#030303 72%);filter:contrast(1.6) grayscale(1);box-shadow:0 0 60px #fff}
#hair{position:absolute;inset:-7% -4% 58%;background:#000;border-radius:45% 55% 10% 10%;clip-path:polygon(0 0,100% 0,92% 80%,83% 45%,70% 100%,58% 35%,48% 100%,35% 38%,24% 92%,13% 45%,4% 88%)}
.eye{position:absolute;top:31%;width:30%;height:22%;background:#050505;border-radius:50%;box-shadow:0 0 18px 5px #000,inset 0 0 20px #500}
.eye:before{content:"";position:absolute;width:18%;height:35%;left:43%;top:35%;background:#eee;border-radius:50%;box-shadow:0 0 15px #fff}
#eye1{left:9%;transform:rotate(-13deg)}#eye2{right:9%;transform:rotate(13deg)}
.brow{position:absolute;top:26%;width:36%;height:10%;background:#080808;border-radius:50%}
#b1{left:7%;transform:rotate(16deg)}#b2{right:7%;transform:rotate(-16deg)}
#nose{position:absolute;top:45%;left:39%;width:22%;height:22%;background:linear-gradient(90deg,#222,#bbb,#111);clip-path:polygon(50% 0,5% 100%,95% 100%)}
#mouth{position:absolute;top:62%;left:17%;width:66%;height:30%;background:#020202;border-radius:45%;box-shadow:0 0 20px #900;overflow:hidden;border:3px solid #111}
#upper,#lower{position:absolute;left:3%;width:94%;height:22%;background:#ddd}
#upper{top:0;clip-path:polygon(0 0,100% 0,92% 100%,80% 70%,70% 100%,60% 65%,50% 100%,40% 65%,30% 100%,20% 65%,10% 100%)}#lower{bottom:0;clip-path:polygon(0 100%,100% 100%,90% 0,80% 40%,70% 0,60% 40%,50% 0,40% 40%,30% 0,20% 40%,10% 0)}
#overlay{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#scare.active #scene{animation:approach .85s cubic-bezier(.2,.8,.1,1) forwards,shake .08s 10 .9s}
#scare.active #face{animation:distort .11s 12 .1s}
#scare.active #overlay{animation:flash .09s 8}
@keyframes approach{0%{transform:scale(.18) translateY(15vh);filter:blur(8px)}55%{transform:scale(1.45);filter:blur(0)}100%{transform:scale(1.08)}}
@keyframes shake{0%{transform:translate(0)}25%{transform:translate(12px,-7px)}50%{transform:translate(-10px,8px)}75%{transform:translate(8px,4px)}100%{transform:translate(0)}}
@keyframes distort{0%{transform:scale(1)}50%{transform:scale(1.08,.93) rotate(1deg)}100%{transform:scale(1)}}
@keyframes flash{0%,100%{opacity:0}50%{opacity:.65}}
#scare.active{animation:redblink .13s 7}
@keyframes redblink{50%{background:#600}}
#replay{position:absolute;bottom:20px;z-index:15;display:none;background:#202020;color:#eee;font-size:14px}
</style></head>
